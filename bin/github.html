<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Loading...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html,body{margin:0;padding:0;width:100%;height:100%;background:black;overflow:hidden;}
    canvas{display:block;width:100%;height:100%;}
  </style>
</head>
<body>
<canvas id="matrix-canvas"></canvas>
<script>
  // Get target URL from query string
  const params = new URLSearchParams(window.location.search);
  const target = params.get('url') || 'https://github.com/eexodus1';

  const canvas = document.getElementById('matrix-canvas');
  const ctx = canvas.getContext('2d');

  function resizeMatrix(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resizeMatrix();
  window.addEventListener('resize', resizeMatrix);

  const letters = ['0','1'];
  const fontSize = 18;
  let columns = Math.floor(window.innerWidth / fontSize);
  let drops = Array(columns).fill(1);

  function drawMatrix(){
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle = '#22ff88';
    ctx.font = fontSize + 'px JetBrains Mono';

    for(let i=0;i<drops.length;i++){
      const text = letters[Math.floor(Math.random()*letters.length)];
      ctx.fillText(text, i*fontSize, drops[i]*fontSize);

      if(drops[i]*fontSize > canvas.height && Math.random() > 0.975){
        drops[i] = 0;
      }
      drops[i]++;
    }
  }

  const interval = setInterval(drawMatrix, 33);

  // redirect after 2.5 seconds
  setTimeout(() => {
    clearInterval(interval);
    window.location.href = target;
  }, 2500);
</script>
</body>
</html>
